name: CI

# AGENTS §3.7: verification from commit one — fmt/clippy on the Rust side,
# lint/typecheck/test on the frontend. Command set mirrors TESTING.md §6.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · typecheck · test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + component tests
        run: npm test

  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        # Noninteractive + IPv4 + timeout bounds to prevent Azure runner stalls
        run: |
          set -euo pipefail
          echo 'debconf debconf/frontend select Noninteractive' | sudo debconf-set-selections
          sudo debconf-set-selections <<< "man-db man-db/auto-update boolean false"
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true update
          PKGS="libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev libavdevice-dev \
            libavfilter-dev libpipewire-0.3-dev libasound2-dev \
            pkg-config ffmpeg"
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true install -y --no-install-recommends $PKGS

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri
