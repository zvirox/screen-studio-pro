name: Release

# PLAN 7.5 (pipeline part pulled forward for the v0.0.1-alpha.1 prerelease).
# Trigger: pushing a `v*` tag. Two jobs run in parallel and attach to the same
# GitHub Release:
#   1. tauri-action  → .deb, .rpm, AppImage  (Tauri 2 CLI 2.12.4 has no
#      `flatpak` bundle target, verified locally — hence job 2)
#   2. flatpak-builder → single-file .flatpak bundle
# A hyphen in the tag (v0.0.1-alpha.1) marks the Release as Pre-release;
# clean vX.Y.Z tags publish as full releases. No secrets beyond GITHUB_TOKEN.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tauri-bundles:
    name: Linux bundles (.deb · .rpm · AppImage)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Same proven dependency set as ci.yml's rust job (CI green with it),
      # plus libfuse2t64 — the AppImage tooling needs a FUSE runtime present
      # on ubuntu-24.04-based runners.
      - name: Install Tauri system dependencies
        # ubuntu runners intermittently hang in apt-get with no output; bound
        # each attempt and retry instead of burning the whole job budget.
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          PKGS="libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libavcodec-dev libavformat-dev \
            libavutil-dev libswscale-dev libswresample-dev libavdevice-dev \
            libavfilter-dev libpipewire-0.3-dev libasound2-dev \
            pkg-config ffmpeg libfuse2t64"
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get update && timeout 600 sudo apt-get install -y $PKGS; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sudo pkill -9 -f apt-get || true
            sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock
            sleep 10
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ScreenStudio Pro ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this build."
          releaseDraft: false
          # v0.0.1-alpha.1 → prerelease; vX.Y.Z → full release.
          prerelease: ${{ contains(github.ref_name, '-') || contains(github.ref_name, '+') }}
          args: --bundles deb,rpm,appimage

      # tauri-action's releaseBody is only a pointer — put the real change
      # note on the release page from the versioned file in the repo.
      - name: Set release notes from change file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME#v}.md"
          gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES"

  flatpak:
    name: Flatpak (.flatpak bundle)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # GNOME 48 runtime: ships webkit2gtk-4.1 (Tauri's webview) and the
      # PipeWire/ALSA headers the capture core builds against. ffmpeg is NOT
      # in the runtime — the manifest builds nasm/x264/ffmpeg self-contained
      # into /app. The Rust toolchain is a manifest source (flatpak-builder
      # 1.4.2 appends the runtime branch to sdk-extensions, and no
      # rust-stable//48 exists). LLVM 18 is installed here only as a source
      # of libclang for bindgen; it is staged into the checkout below rather
      # than declared as an SDK extension, for the same branch reason.
      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive \
            org.gnome.Platform//48 org.gnome.Sdk//48 \
            org.freedesktop.Sdk.Extension.llvm18//24.08

      - name: Stage libclang for the offline sandbox build
        run: |
          set -euo pipefail
          LIBDIR=$(dirname "$(find "$HOME/.local/share/flatpak/runtime/org.freedesktop.Sdk.Extension.llvm18/x86_64/24.08" -name libclang.so -print -quit)")
          test -n "$LIBDIR"
          mkdir -p libclang
          cp -a "$LIBDIR"/libclang.so* "$LIBDIR"/libclang-cpp.so* \
            "$LIBDIR"/libLLVM* libclang/
          if [ -d "$LIBDIR/clang" ]; then
            cp -a "$LIBDIR/clang" libclang/
          fi
          CLANG_INC=$(dirname "$(find "$LIBDIR" -type f -name stdbool.h -print -quit)")
          test -n "$CLANG_INC"
          mkdir -p libclang/include
          cp -a "$CLANG_INC"/* libclang/include/
          ls -la libclang
          ls -la libclang/include || true

      # The frontend is built OUTSIDE the sandbox: the app module is a `dir`
      # source (this checkout) and node/npm do not exist inside it. Tauri 2
      # embeds ../dist into the binary at cargo build time. node_modules is
      # dropped so the sandbox copy stays lean.
      - name: Build frontend
        run: |
          npm ci
          npm run build
          rm -rf node_modules

      # The build sandbox has no DNS, so neither rustup nor crates.io is
      # reachable. Vendor every crate here and point Cargo at /app/lib/vendor
      # (where the manifest copies it) so cargo builds fully offline.
      - name: Vendor Rust crates for the offline sandbox build
        run: |
          cd src-tauri
          cargo vendor ../vendor
          mkdir -p ../.cargo
          cat > ../.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = "vendored-sources"

          [source.vendored-sources]
          directory = "/app/lib/vendor"
          EOF

      # Keep the AppStream entry truthful: stamp THIS tag + today's date into
      # the <release> element before the bundle is built.
      - name: Stamp the release entry into metainfo
        run: |
          sed -i \
            -e "s/<release version=\"[^\"]*\"/<release version=\"${GITHUB_REF_NAME}\"/" \
            -e "s/ date=\"[^\"]*\"/ date=\"$(date +%F)\"/" \
            packaging/flatpak/com.zvirox.screenstudiopro.metainfo.xml

      - name: Build flatpak
        # Runtime, SDK and the rust-stable extension were installed explicitly
        # above. flatpak-builder's --install-deps-from re-checks the extension
        # against the *runtime* metadata (GNOME 48 does not declare it) and
        # fails with "Unknown extension ... in runtime" — so do not use it.
        run: |
          flatpak-builder --user --force-clean \
            --repo=.flatpak-repo .flatpak-build \
            packaging/flatpak/com.zvirox.screenstudiopro.json

      - name: Create single-file bundle
        run: |
          flatpak build-bundle .flatpak-repo \
            "ScreenStudio-Pro-${GITHUB_REF_NAME}-x86_64.flatpak" \
            com.zvirox.screenstudiopro

      # Fallback create: the tauri-bundles job usually makes the Release
      # first; if this job wins the race (or that job failed), create it so
      # the bundle is never orphaned.
      - name: Attach bundle to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ScreenStudio-Pro-${{ github.ref_name }}-x86_64.flatpak
        run: |
          gh release upload "$GITHUB_REF_NAME" "$BUNDLE" --clobber || \
            gh release create "$GITHUB_REF_NAME" "$BUNDLE" \
              --prerelease \
              --title "ScreenStudio Pro $GITHUB_REF_NAME" \
              --notes "Prerelease build. See assets."
