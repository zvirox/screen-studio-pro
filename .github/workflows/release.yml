name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    uses: zvirox/release-workflows/.github/workflows/linux-release.yml@v1
    with:
      app_name: ${{ github.event.repository.name }}
      frontend_dir: .
      system_deps: libxdo-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev libavdevice-dev libavfilter-dev libpipewire-0.3-dev libasound2-dev ffmpeg
      build_cmd: cargo build --release --locked --manifest-path src-tauri/Cargo.toml --target-dir target
      binary_path: target/release/screen-studio-pro
      nfpm_config: packaging/nfpm.yaml
    secrets: inherit
