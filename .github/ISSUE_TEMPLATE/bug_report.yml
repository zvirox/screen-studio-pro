name: Bug report
description: Something in ScreenStudio Pro is broken or behaves wrongly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. Please fill in the parts you can — partial reports are still useful.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start a recording with …
        2. Press …
        3. See error
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture (monitor / window / region)
        - Audio
        - Camera (PiP)
        - HUD
        - Encoders / output files
        - Library
        - Settings
        - Shortcuts / tray
        - UI / design
        - Build / packaging
        - Other
    validations:
      required: true
  - type: input
    id: compositor
    attributes:
      label: Desktop environment / compositor
      placeholder: e.g. Hyprland 0.49, KDE Plasma 6.4 (Wayland), niri 25.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Contents of the app log (~/.local/state/screen-studio-pro/logs) — redact anything personal
      render: shell
