[package]
name = "screen-studio-pro"
version = "0.1.0-beta.5"
description = "A modern open-source screen recording app for Linux"
authors = ["zvirox"]
edition = "2024"
# Two binaries exist (the app + the `ssp-mux` helper); pin the default so
# `cargo run` / `tauri dev` build the app binary, not the helper.
default-run = "screen-studio-pro"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "screen_studio_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Phase 9.2 (PLAN 9.2): the parent process keeps the encoders; this helper
# owns libavformat and finalizes the take on stdin EOF. Requires the same
# system ffmpeg dev libs as the encode feature.
[[bin]]
name = "ssp-mux"
path = "src/bin/ssp-mux.rs"
required-features = ["encode"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["full"] }
async-trait = "0.1.92"
ashpd = { version = "0.13.13", features = ["screencast", "global_shortcuts"] }
pipewire = "0.10.1"
cpal = "0.18.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-appender = "0.2.5"
config = { version = "0.15.27", features = ["toml"] }
# Direct handle on the TOML backend (already resolved via config's toml
# feature) — settings save needs serialized TOML output, which config
# (read-oriented) doesn't provide. No new third-party code enters the tree.
toml = "1.1.8"
# Preview stills ride `source_preview` as base64 JPEG (API §2.1, task 3.5).
# Already resolved in Cargo.lock via the tauri/ashpd tree — promoted to a
# direct handle, no new third-party code enters the tree (same law as toml).
base64 = "0.23.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
image = "0.25.10"
starship-plugin = { git = "https://github.com/zvirox/starship-control", branch = "main" }
v4l2r = { version = "0.0.8", optional = true }
ffmpeg-next = { version = "9.0.0", optional = true, features = ["non-exhaustive-enums"] }
ffmpeg-sys-next = { version = "9.0.1", optional = true }
# Phase 10.1 zero-copy DMA-BUF ingestion. khronos-egl dlopens libEGL at
# runtime (no build-time libEGL headers needed); drm-fourcc names the DRM
# fourcc/modifier constants; memmap2 is the CPU-map fallback when a driver
# forbids host mapping. All behind the `encode` feature.
khronos-egl = { version = "6.0.0", optional = true, features = ["dynamic"] }
drm-fourcc = { version = "2.2.0", optional = true }
memmap2 = { version = "0.9", optional = true }
# Phase 14.1 dynamic module ABI (runtime dlopen, no system build deps).
libloading = { version = "0.8", optional = true }
# Phase 11.2 RNNoise voice isolation (pure-Rust port, no system lib).
nnnoiseless = { version = "0.4", optional = true }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
# Tauri's mock runtime lets IPC contract tests invoke registered commands
# without opening the desktop application's real windows.
tauri = { version = "2", features = ["test"] }

[features]
# Media backends. `encode` is default-on since task 1.3 — the recording
# core (libavcodec/libavformat/swscale against system ffmpeg dev libs:
# `sudo dnf install ffmpeg-devel`) must be covered by plain `cargo test`
# and ci.yml; see SETUP.md §3.1 for the build requirement.
default = ["encode"]
encode = ["dep:ffmpeg-next", "dep:ffmpeg-sys-next", "dep:khronos-egl", "dep:drm-fourcc", "dep:memmap2", "dep:nnnoiseless", "dep:libloading"]
camera = ["dep:v4l2r"]
# Enables the Tauri custom protocol (`tauri://localhost`) and static asset
# embedding for release builds. Required when building via raw cargo (e.g. Flatpak).
custom-protocol = ["tauri/custom-protocol"]
